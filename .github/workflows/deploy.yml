name: Deploy

# Every push to prod (i.e. a merged pull request) deploys the backend to Cloud Run and the
# frontend to Cloudflare -- but only after Riya clicks Approve on the spendscope-live
# environment. Nobody holds standing deploy credentials: Google lets this job act as the
# github-deployer account only when GitHub proves it is THIS repo, the prod branch AND the
# approved spendscope-live environment. github-deployer can ship code but cannot read
# Secret Manager, so the database URL and Plaid keys never pass through GitHub.
on:
  push:
    branches: [prod]

concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: spendscope-live
    env:
      PROJECT: spendscope-app
      REGION: us-east1
      SERVICE: spendscope-api
      API_URL: https://spendscope-api-579386639091.us-east1.run.app
      IMAGE: us-east1-docker.pkg.dev/spendscope-app/cloud-run-source-deploy/spendscope-api:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/579386639091/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@spendscope-app.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push backend image
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # --image only: env vars and secret references already on the service are kept as-is.
      - name: Deploy backend
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "$PROJECT" --quiet

      - name: Backend health check
        run: |
          for i in $(seq 1 10); do
            curl -sf "$API_URL/health" && exit 0
            sleep 6
          done
          echo "Backend did not report healthy"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Vite bakes VITE_API_URL in at build time; the grep guards against shipping a bundle
      # that still points at a local dev server.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: |
          npm ci
          npm run build
          grep -q "spendscope-api-579386639091" dist/assets/*.js
          ! grep -q "127.0.0.1:8000" dist/assets/*.js

      - name: Deploy frontend
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4d9e08b4608e59a097168556189652e2
        run: npx --yes wrangler@4 deploy
