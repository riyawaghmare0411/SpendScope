# Flags for the GitHub OIDC provider (kept in a file so Windows shells don't mangle && and quotes).
# Google accepts a GitHub token only from this repo (by numeric id, survives renames), the prod
# branch, and the spendscope-live environment -- i.e. only after Riya approved the deploy.
--issuer-uri: https://token.actions.githubusercontent.com
--attribute-mapping: google.subject=assertion.sub,attribute.repository_id=assertion.repository_id,attribute.environment=assertion.environment,attribute.ref=assertion.ref
--attribute-condition: "assertion.repository_id == '1180229720' && assertion.ref == 'refs/heads/prod' && assertion.environment == 'spendscope-live'"
